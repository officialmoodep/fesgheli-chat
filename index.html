<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>چت مخفی</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#8a8a8a);--btn:var(--tg-theme-button-color,#6c4cf1);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f1f5);--mine:#6c4cf1;--mine-tx:#fff;--oth:var(--tg-theme-secondary-bg-color,#eee)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sec);border-bottom:1px solid #00000014}
header .av{width:38px;height:38px;border-radius:50%;background:var(--btn);color:var(--btx);display:grid;place-items:center;font-weight:700}
header .t{flex:1;min-width:0}header .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .t small{color:var(--hint)}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.ic{font-size:20px;padding:6px 8px;border-radius:10px}.ic:active{background:#00000014}
#sel{display:none;align-items:center;gap:8px;padding:10px 14px;background:var(--btn);color:var(--btx)}#sel b{flex:1}
#list{flex:1;overflow-y:auto;padding:12px 10px 6px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.row{display:flex}.row.me{justify-content:flex-start}.row.ot{justify-content:flex-end}
.b{max-width:82%;padding:7px 11px 5px;border-radius:16px;white-space:pre-wrap;word-break:break-word;line-height:1.7;position:relative}
.me .b{background:var(--mine);color:var(--mine-tx);border-bottom-right-radius:5px}
.ot .b{background:var(--oth);border-bottom-left-radius:5px}
.b small{display:block;font-size:11px;opacity:.65;margin-top:2px;text-align:left;direction:ltr}
.q{border-right:3px solid currentColor;padding:2px 8px;margin:0 0 4px;opacity:.8;font-size:13px;background:#00000014;border-radius:6px;max-height:44px;overflow:hidden}
.row.pick .b{outline:3px solid #ffb703}
.empty{margin:auto;color:var(--hint);text-align:center;line-height:2}
#rep{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--sec);border-top:1px solid #00000014;font-size:13px}#rep span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--hint)}
footer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid #00000014}
textarea{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 14px;border-radius:21px;border:1px solid #00000022;background:var(--sec);color:var(--tx);font:inherit;outline:none;line-height:1.5}
#send{width:42px;height:42px;border-radius:50%;background:var(--btn);color:var(--btx);font-size:18px;flex:none}#send:disabled{opacity:.5}
#sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:5}
#sheet div{width:100%;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
#sheet button{display:block;width:100%;text-align:right;padding:14px 16px;font-size:16px;border-radius:12px}#sheet button:active{background:var(--sec)}
#msg{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:var(--bg);z-index:9;padding:24px;line-height:2}
</style>
</head>
<body>
<header><div class="av" id="av">🔒</div><div class="t"><b id="name">چت مخفی</b><small>🔒 فقط شما دو نفر</small></div><button class="ic" id="menu" style="font-size:14px;color:#e5484d;font-weight:700">🔚 پایان چت</button></header>
<div id="sel"><button class="ic" id="selx">✕</button><b id="selc">۰ انتخاب</b><button class="ic" id="seld">🗑</button></div>
<div id="list"><div class="empty">در حال بارگذاری…</div></div>
<div id="rep"><span id="reptx"></span><button class="ic" id="repx">✕</button></div>
<footer><textarea id="inp" rows="1" maxlength="1000" placeholder="پیام…"></textarea><button id="send">➤</button></footer>
<div id="sheet"><div><button id="a-reply">↩️ پاسخ</button><button id="a-del">🗑 حذف دوطرفه</button><button id="a-sel">☑️ انتخاب</button></div></div>
<div id="msg"></div>
<script>
// آدرس API (همون تابع telegram-bot). اگه پروژه‌ی Supabase عوض شد، فقط همین خط رو عوض کن.
const API = "https://hqsjoolraxqftnzypyuz.supabase.co/functions/v1/telegram-bot/sc/";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("secondary_bg_color"); } catch (e) {} }
const $ = (id) => document.getElementById(id);
const code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("code") || "";
const msgs = new Map(); let me = 0, lastId = 0, replyTo = null, picking = new Set(), selMode = false, sheetId = null, dead = false, busy = false;
const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const hhmm = (ts) => { const d = new Date(ts * 1000); return fa(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")); };
function end(text) { dead = true; const m = $("msg"); m.textContent = text; m.style.display = "grid"; }
async function api(act, body) {
  const r = await fetch(API + act, { method: "POST", headers: { "content-type": "application/json", "x-tg-init": tg ? tg.initData : "" }, body: JSON.stringify(Object.assign({ code }, body || {})) });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 404 || (j && j.error === "no_chat")) { end("🗑 این چت مخفی حذف شده یا برای تو نیست."); throw new Error("gone"); }
  if (r.status === 401) { end("⚠️ این صفحه رو فقط از داخل تلگرام و با دکمه‌ی «نمایش چت» باز کن."); throw new Error("auth"); }
  if (!r.ok) throw Object.assign(new Error("http"), { data: j });
  return j;
}
function render(keepBottom) {
  const el = $("list"), nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  el.textContent = "";
  if (!msgs.size) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "هنوز پیامی نیست.\nاولین پیام رو بفرست 👇"; el.appendChild(e); return; }
  for (const m of [...msgs.values()].sort((a, b) => a.id - b.id)) {
    const row = document.createElement("div"); row.className = "row " + (m.from === me ? "me" : "ot") + (picking.has(m.id) ? " pick" : "");
    const b = document.createElement("div"); b.className = "b";
    if (m.reply_to) { const q = document.createElement("div"); q.className = "q"; const r = msgs.get(m.reply_to); q.textContent = r ? r.text : "پیام حذف‌شده"; b.appendChild(q); }
    b.appendChild(document.createTextNode(m.text));
    const s = document.createElement("small"); s.textContent = hhmm(m.ts); b.appendChild(s);
    b.onclick = () => (selMode ? toggle(m.id) : openSheet(m.id));
    row.appendChild(b); el.appendChild(row);
  }
  if (keepBottom || nearBottom) el.scrollTop = el.scrollHeight;
}
function openSheet(id) { sheetId = id; $("sheet").style.display = "flex"; }
function closeSheet() { $("sheet").style.display = "none"; }
function toggle(id) { picking.has(id) ? picking.delete(id) : picking.add(id); if (!picking.size) exitSel(); else updSel(); render(); }
function updSel() { $("sel").style.display = "flex"; $("selc").textContent = fa(picking.size) + " انتخاب"; }
function exitSel() { selMode = false; picking.clear(); $("sel").style.display = "none"; render(); }
function setReply(id) { replyTo = id; const m = msgs.get(id); $("rep").style.display = "flex"; $("reptx").textContent = "↩️ " + (m ? m.text : ""); $("inp").focus(); }
function clearReply() { replyTo = null; $("rep").style.display = "none"; }
function confirmBox(text, ok) { if (tg && tg.showConfirm) tg.showConfirm(text, (y) => y && ok()); else if (confirm(text)) ok(); }
function absorb(j, first) {
  if (j.me) me = j.me;
  if (j.other && first) { $("name").textContent = j.other.name; $("av").textContent = (j.other.name || "؟").trim().charAt(0); }
  if (j.ids) { const keep = new Set(j.ids), oldest = j.ids.length ? Math.min(...j.ids) : 0; for (const id of [...msgs.keys()]) if (!keep.has(id) && (j.ids.length < 400 || id >= oldest)) msgs.delete(id); }
  for (const m of j.msgs || []) { msgs.set(m.id, m); if (m.id > lastId) lastId = m.id; }
}
async function load() { try { const j = await api("open"); absorb(j, true); render(true); } catch (e) { if (!dead) end("⚠️ خطا در بارگذاری؛ دوباره باز کن."); } }
async function poll() {
  if (dead || busy || document.hidden) return;
  try { const j = await api("poll", { since: lastId }); const n = msgs.size; absorb(j); render(); if (tg && j.msgs && j.msgs.some((m) => m.from !== me) && n !== msgs.size) { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} } } catch (e) {}
}
async function send() {
  const t = $("inp").value.trim(); if (!t || busy || dead) return;
  busy = true; $("send").disabled = true;
  try { const j = await api("send", { text: t, reply_to: replyTo }); msgs.set(j.msg.id, j.msg); if (j.msg.id > lastId) lastId = j.msg.id; $("inp").value = ""; $("inp").style.height = ""; clearReply(); render(true); }
  catch (e) { const er = e && e.data && e.data.error; if (!dead && tg) tg.showAlert(er === "rate" ? "یکم آروم‌تر 😅 چند ثانیه صبر کن" : er === "long" ? "پیام خیلی بلنده" : "ارسال نشد؛ دوباره امتحان کن"); }
  busy = false; $("send").disabled = false; $("inp").focus();
}
async function del(ids) { try { await api("del", { ids }); ids.forEach((i) => msgs.delete(i)); render(); } catch (e) { if (!dead && tg) tg.showAlert("حذف نشد؛ دوباره امتحان کن"); } }
$("send").onclick = send;
$("inp").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); send(); } });
$("inp").addEventListener("input", (e) => { const t = e.target; t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; });
$("sheet").onclick = (e) => { if (e.target.id === "sheet") closeSheet(); };
$("a-reply").onclick = () => { closeSheet(); setReply(sheetId); };
$("a-del").onclick = () => { const id = sheetId; closeSheet(); confirmBox("این پیام برای هر دو طرف پاک بشه؟", () => del([id])); };
$("a-sel").onclick = () => { closeSheet(); selMode = true; picking.add(sheetId); updSel(); render(); };
$("selx").onclick = exitSel;
$("seld").onclick = () => { const ids = [...picking]; confirmBox("میخوای " + fa(ids.length) + " پیام رو دوطرفه حذف کنی؟", async () => { await del(ids); exitSel(); }); };
$("repx").onclick = clearReply;
$("menu").onclick = () => confirmBox("چت برای هر دو نفر پایان پیدا کنه و همه‌ی پیام‌ها پاک بشن؟", async () => { try { await api("clear"); end("🔚 چت مخفی پایان یافت و پیام‌ها پاک شدند."); } catch (e) {} });
if (!code) end("لینک چت نامعتبره.");
else { load(); setInterval(poll, 2500); document.addEventListener("visibilitychange", poll); }
</script>
</body>
</html>
